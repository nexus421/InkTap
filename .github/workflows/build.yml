name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Test and build debug APK
        run: ./gradlew test assembleDebug
