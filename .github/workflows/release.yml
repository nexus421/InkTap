name: Release APK

# Publishing a GitHub release with a tag like v1.2.3 builds a signed release APK and attaches it to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or 1.2.3, was '$TAG'"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.INKTAP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret INKTAP_KEYSTORE_BASE64 is missing, see README.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inktap.jks"

      - name: Test and build release APK
        env:
          INKTAP_KEYSTORE_FILE: ${{ runner.temp }}/inktap.jks
          INKTAP_KEYSTORE_PASSWORD: ${{ secrets.INKTAP_KEYSTORE_PASSWORD }}
          INKTAP_KEY_ALIAS: ${{ secrets.INKTAP_KEY_ALIAS }}
          INKTAP_KEY_PASSWORD: ${{ secrets.INKTAP_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease -PversionName=${{ steps.version.outputs.name }}

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          APK="InkTap-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release upload "$TAG" "$APK" --clobber

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/inktap.jks"
