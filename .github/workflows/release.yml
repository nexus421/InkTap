name: Release

# Publishing a GitHub release with a tag like v1.2.3 builds the signed release APK and AAB and attaches both.
# The signing secrets live in the environment "release", which only tags v* may use (see README.md).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like v1.2.3 or 1.2.3, was '$TAG'"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      # Tests run before any secret is in the job, so test code never sees the signing material.
      - name: Test
        run: ./gradlew test

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.APPOTHEK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret APPOTHEK_KEYSTORE_BASE64 is missing, see README.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/appothek.jks"

      - name: Build release APK and AAB
        env:
          APPOTHEK_KEYSTORE_FILE: ${{ runner.temp }}/appothek.jks
          APPOTHEK_KEYSTORE_PASSWORD: ${{ secrets.APPOTHEK_KEYSTORE_PASSWORD }}
          APPOTHEK_KEY_ALIAS: ${{ secrets.APPOTHEK_KEY_ALIAS }}
          APPOTHEK_KEY_PASSWORD: ${{ secrets.APPOTHEK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease -PversionName=${{ steps.version.outputs.name }}

      - name: Attach APK and AAB to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "Appothek-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "Appothek-$VERSION.aab"
          gh release upload "$TAG" "Appothek-$VERSION.apk" "Appothek-$VERSION.aab" --clobber

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/appothek.jks"
